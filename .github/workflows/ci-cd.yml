name: Build & Deploy Cyber-Clicker with Security Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1 : Tests du Code Python & Analyse de Sécurité
  # -------------------------------------------------------------
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des outils de test et de sécurité
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 bandit safety

      - name: 1. Test de Syntaxe & Qualité du Code (Flake8)
        run: |
          # Arrête le job si erreur de syntaxe ou variables non définies
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 2. Analyse de Sécurité du Code Python (Bandit)
        run: |
          # Recherche les failles de sécurité courantes dans le code Python
          bandit -r . -ll -ii || true

      - name: 3. Audit de Sécurité des Dépendances (Safety)
        run: |
          # Vérifie si Pygame ou d'autres packages ont des vulnérabilités connues (CVE)
          safety check -r requirements.txt || true

      - name: 4. Exécution des Tests Unitaires (Pytest)
        run: |
          # Lance les tests automatisés s'il y a un dossier/fichier de test
          pytest --doctest-modules || true

  # -------------------------------------------------------------
  # JOB 2 : Scan du Dockerfile & Publication de l'image
  # -------------------------------------------------------------
  build-and-push:
    needs: quality-and-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Conversion du nom de dépôt en minuscules
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Construction de l'image Docker locale pour scan
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: local-test-image:latest

      - name: 5. Scan de Sécurité du Conteneur Docker (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-test-image:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Connexion au registre GitHub Packages (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:latest
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:${{ github.sha }}
